footprint: [[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]] 
#robot_radius: 0.4

obstacle_range: 3.0
raytrace_range: 4.0

static_layer:
  enabled: true
  map_topic: /map


obstacle_layer:
  enabled: true
  track_unknown_space: true
  combination_method: 1

  # /scan在base_link中生成，但costmap会将其转换到map后再检查z。
  # 多楼层使用连续3D定位，因此不能沿用默认的绝对高度上限2m。
  max_obstacle_height: 50.0

  obstacle_range: 3.0
  raytrace_range: 4.0
  observation_sources: scan
  scan: {
    data_type: LaserScan,
    topic: /scan,
    marking: true,
    clearing: true,
    inf_is_valid: true,
    min_obstacle_height: -50.0,
    max_obstacle_height: 50.0
  }
  
