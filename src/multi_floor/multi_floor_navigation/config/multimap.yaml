# 每座实体楼梯只在一个楼层下定义一次；反向路线由加载器自动倒序生成，
# 且每个反向路径点的yaw会增加pi并归一化到[-pi, pi]。
# 当前楼层入口使用node_index，反向端点使用99 - node_index。
# route中的第三个数是yaw，单位为弧度。
floors:
  B4:
    map: map1.yaml
    stairs:
      - node_index: 0
        to: B5
        route:
          - [0, 1, 12]
          - [0, 3, 12]
          - [1, 3, 12]
          - [1, 2, 3]
          - [1, 3, 4]

      - node_index: 1
        to: B5
        route:
          - [0, 1, 12]
          - [0, 3, 12]
          - [1, 3, 12]
          - [1, 2, 3]
          - [1, 3, 4]
          - [2, 3, 4]

      - node_index: 2
        to: B5
        route:
          - [0, 1, 12]
          - [0, 3, 12]
          - [1, 3, 12]
          - [1, 2, 3]
          - [1, 3, 4]
          - [2, 3, 4]
          - [2, 3, 4]

  B5:
    map: map2.yaml
    stairs: []
