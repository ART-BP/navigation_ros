# 每座实体楼梯只在一个楼层下定义一次；反向路线由加载器自动倒序生成。
# 当前楼层入口使用node_index，反向端点使用99 - node_index。
# route配置[x, y, z]。z当前只会被读取和保存，不参与规划及控制计算。
# 每段起点yaw由该点朝向下一点的xy连线自动计算，最后一个点不需要yaw。
floors:
  B4:
    map: B4.yaml
    stairs:
      - node_index: 0
        to: B5
        route:
          - [0, 1, 0]
          - [0, 3, 0]
          - [1, 3, 0]
          - [1, 2, 0]
          - [1, 3, 0]

      - node_index: 1
        to: B5
        route:
          - [0, 1, 0]
          - [0, 3, 0]
          - [1, 3, 0]
          - [1, 2, 0]
          - [1, 3, 0]
          - [2, 3, 0]

      - node_index: 2
        to: B5
        route:
          - [0, 1, 0]
          - [0, 3, 0]
          - [1, 3, 0]
          - [1, 2, 0]
          - [1, 3, 0]
          - [2, 3, 0]

  B5:
    map: B5.yaml
    stairs: []
