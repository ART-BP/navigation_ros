# 每座实体楼梯只在一个楼层下定义一次；反向路线由加载器自动倒序生成。
# 当前楼层入口使用node_index，反向端点使用99 - node_index。
# route配置[x, y, z]。z当前只会被读取和保存，不参与规划及控制计算。
# 每段起点yaw由该点朝向下一点的xy连线自动计算，最后一个点不需要yaw。
floors:
  B4:
    map: B4.yaml
    stairs:
      - node_index: 0
        to: B5
        route:
          - [-11.748, -13.498, 0]
          - [-7.016, -13.756, 0]
          - [-7.168, -15.489, 0]
          - [-12.006, -15.209, 0]

  B5:
    map: B5.yaml
    stairs: []
